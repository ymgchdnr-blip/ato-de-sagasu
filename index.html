<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>あとで探す 第4版</title>
<style>
body{margin:0;background:#f5f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#18202b}
header,.box{background:white;border-bottom:1px solid #ddd}.wrap{max-width:1000px;margin:auto;padding:20px}
h1{margin:0}.sub{color:#687386;margin-top:4px}.search{display:flex;gap:10px;margin:20px 0}.search input{flex:1;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}.btn{padding:12px 16px;border:0;border-radius:11px;font-weight:bold;cursor:pointer}.black{background:#111827;color:white}.blue{background:#eaf2ff;color:#185abc}
.box{border:1px solid #ddd;border-radius:16px;padding:18px;margin:16px 0}.connect{display:flex;align-items:center;justify-content:space-between;gap:15px}.folder{background:#f3f7ff;border-radius:12px;padding:12px;margin-top:12px}
#status{display:none;background:#e9f8ed;border:1px solid #a9ddb4;color:#176b2c;border-radius:12px;padding:12px;margin:15px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:white;border:1px solid #ddd;border-radius:14px;overflow:hidden}.thumb{height:145px;background:#eee;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:12px}.tag{display:inline-block;background:#f0f2f4;border-radius:20px;padding:4px 8px;font-size:11px;margin:3px}.empty{text-align:center;color:#777;padding:30px}
small{color:#687386}@media(max-width:650px){.connect{display:block}.cards{grid-template-columns:1fr 1fr}.wrap{padding:14px}}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="あとで探す">
<meta name="mobile-web-app-capable" content="yes">

</head>
<body>
<header><div class="wrap"><h1>あとで探す</h1><div class="sub">保存した情報を、あとから自然な言葉で探す</div></div></header>
<main class="wrap">
<div class="search"><input id="q" placeholder="例：給湯器のエラー、バッテリー、登山…"><button class="btn black" onclick="search()">検索</button></div>
<div id="status"></div>

<section class="box">
<div class="connect"><div><h2 style="margin:0">☁️ Google Drive</h2><p style="margin:6px 0;color:#687386">3台で同じ「あとで探す」を使うための保存場所</p></div>
<button class="btn blue" onclick="connect()">Google Driveと接続する</button></div>
<div class="folder">📁 <b>あとで探す</b><br><small>ここを共通の保存場所として使います。</small></div>
</section>

<section class="box"><h2>📷 写真・スクショを追加</h2>
<input id="files" type="file" accept="image/*" multiple>
<button class="btn black" onclick="document.getElementById('files').click()">写真ライブラリから選択</button>
<button class="btn" onclick="document.getElementById('camera').click()">📷 カメラ</button>
<input id="camera" type="file" accept="image/*" capture="environment" style="display:none">
<p><small>※現在は試作版のため、写真はこのブラウザ内にも一時保存されます。Google Driveへの自動保存は接続機能を追加した後に有効になります。</small></p>
</section>

<section class="box"><h2>最近保存したもの <span id="count"></span></h2><div id="cards" class="cards"></div></section>
</main>
<script>
const KEY="ato_de_sagasu_v4";let items=JSON.parse(localStorage.getItem(KEY)||"[]");
const FOLDER_ID="19KgdYkBRxvrRvX628ebS2COXmpZDdYSe";  
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}  
function render(a=items){document.getElementById("count").textContent=`（${a.length}件）`;let c=document.getElementById("cards");if(!a.length){c.innerHTML='<div class="empty">まだ保存されたものはありません。</div>';return}c.innerHTML=a.map(x=>`<div class="card"><div class="thumb"><img src="${x.img}"></div><div class="body"><b>${esc(x.title)}</b><br><small>${esc(x.date)}</small><div>${x.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div></div>`).join("")}
function read(f){return new Promise(ok=>{let r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)})}
async function add(fs){
  const token=localStorage.getItem("google_drive_token");
  if(!token){
    show("先に「Google Driveと接続する」を押してください");
    return;
  }

  for(let f of fs){
    if(!f.type.startsWith("image/")) continue;

    try{
      const metadata={
        name:f.name,
        mimeType:f.type,
        parents:[FOLDER_ID]
      };

      const boundary="-------atoDeSagasuBoundary";
      const body=
        `--${boundary}\r\n`+
        `Content-Type: application/json; charset=UTF-8\r\n\r\n`+
        JSON.stringify(metadata)+
        `\r\n--${boundary}\r\n`+
        `Content-Type: ${f.type}\r\n\r\n`;

      const blob=new Blob([
        body,
        f,
        `\r\n--${boundary}--`
      ],{type:`multipart/related; boundary=${boundary}`});

      const response=await fetch(
        "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
        {
          method:"POST",
          headers:{
            Authorization:"Bearer "+token
          },
          body:blob
        }
      );

      if(!response.ok){
        const errorText=await response.text();
        console.error(errorText);
         show("Google Driveへの保存に失敗しました: " + errorText);
        continue;
      }

      const result=await response.json();

      items.unshift({
        title:f.name.replace(/\.[^.]+$/,"")||"新しい写真",
        date:new Date().toISOString(),
        file:f.name,
        driveFileId:result.id
      });

      render(items);
      show("Google Driveの「あとで探す」に保存しました");
    }catch(error){
      console.error(error);
     show("Google Driveへの保存中にエラーが発生しました: " + error.message); 
    }
  }
}
files.onchange=e=>{add(e.target.files);e.target.value=""};camera.onchange=e=>{add(e.target.files);e.target.value=""};
function search(){let q=document.getElementById("q").value.toLowerCase();render(q?items.filter(x=>(x.title+" "+x.tags.join(" ")).toLowerCase().includes(q)):items)}
function show(t){let s=document.getElementById("status");s.textContent=t;s.style.display="block"}
async function connect(){
  if(!window.google){
    const s=document.createElement("script");
    s.src="https://accounts.google.com/gsi/client";
    s.onload=()=>connect();
    document.head.appendChild(s);
    return;
  }

  const tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:"466022765272-k322tc98rl74dc8cfmhi6hp8d31gjttn.apps.googleusercontent.com",
    scope:"https://www.googleapis.com/auth/drive",
    callback:(response)=>{
      if(response.error){
        show("Google Driveへの接続に失敗しました");
        return;
      }
      localStorage.setItem("google_drive_token",response.access_token);
      show("Google Driveに接続しました");
    }
  });

  tokenClient.requestAccessToken();
}
render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
}
</script>

</body></html>
