<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>あとで探す 第5版</title>

<style>
body{
  margin:0;
  background:#f5f7f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  color:#18202b
}

header{
  background:white;
  border-bottom:1px solid #ddd
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:20px
}

h1{
  margin:0
}

.sub{
  color:#687386;
  margin-top:4px
}

.search{
  display:flex;
  gap:10px;
  margin:20px 0
}

.search input{
  flex:1;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px
}

.btn{
  padding:12px 16px;
  border:0;
  border-radius:11px;
  font-weight:bold;
  cursor:pointer
}

.black{
  background:#111827;
  color:white
}

.blue{
  background:#eaf2ff;
  color:#185abc
}

.box{
  background:white;
  border:1px solid #ddd;
  border-radius:16px;
  padding:18px;
  margin:16px 0
}

.connect{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}

.folder{
  background:#f3f7ff;
  border-radius:12px;
  padding:12px;
  margin-top:12px
}

#status{
  display:none;
  border-radius:12px;
  padding:12px;
  margin:15px 0;
  white-space:pre-wrap;
  word-break:break-word
}

.status-ok{
  background:#e9f8ed;
  border:1px solid #a9ddb4;
  color:#176b2c
}

.status-error{
  background:#fff0f0;
  border:1px solid #e0aaaa;
  color:#9b1c1c
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:14px
}

.card{
  background:white;
  border:1px solid #ddd;
  border-radius:14px;
  overflow:hidden
}

.thumb{
  height:145px;
  background:#eee;
  overflow:hidden
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover
}

.body{
  padding:12px
}

.tag{
  display:inline-block;
  background:#f0f2f4;
  border-radius:20px;
  padding:4px 8px;
  font-size:11px;
  margin:3px
}

.empty{
  text-align:center;
  color:#777;
  padding:30px
}

small{
  color:#687386
}

#driveInfo{
  margin-top:10px;
  color:#176b2c;
  font-size:14px
}

@media(max-width:650px){
  .connect{
    display:block
  }

  .cards{
    grid-template-columns:1fr 1fr
  }

  .wrap{
    padding:14px
  }
}
</style>

<link rel="manifest" href="./manifest.webmanifest">

<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="あとで探す">
<meta name="mobile-web-app-capable" content="yes">

</head>

<body>

<header>
<div class="wrap">

<h1>あとで探す</h1>

<div class="sub">
保存した情報を、あとから自然な言葉で探す
</div>

</div>
</header>


<main class="wrap">


<div class="search">

<input
 id="q"
 placeholder="例：給湯器のエラー、バッテリー、登山…">

<button
 class="btn black"
 onclick="search()">
検索
</button>

</div>


<div id="status"></div>


<section class="box">

<div class="connect">

<div>

<h2 style="margin:0">
☁️ Google Drive
</h2>

<p style="margin:6px 0;color:#687386">
3台で同じ「あとで探す」を使うための保存場所
</p>

<div id="driveInfo"></div>

</div>


<button
 class="btn blue"
 onclick="connect()">

Google Driveと接続する

</button>

</div>


<div class="folder">

📁 <b>あとで探す</b>

<br>

<small>
ここを共通の保存場所として使います。
</small>

</div>

</section>



<section class="box">

<h2>📷 写真・スクショを追加</h2>


<input
 id="files"
 type="file"
 accept="image/*"
 multiple
 style="display:none">


<button
 class="btn black"
 onclick="document.getElementById('files').click()">

写真ライブラリから選択

</button>


<button
 class="btn"
 onclick="document.getElementById('camera').click()">

📷 カメラ

</button>


<input
 id="camera"
 type="file"
 accept="image/*"
 capture="environment"
 style="display:none">


<p>

<small>
写真を選ぶとGoogle Driveの「あとで探す」フォルダへ保存します。
</small>

</p>

</section>



<section class="box">

<h2>
最近保存したもの
<span id="count"></span>
</h2>

<div id="cards" class="cards"></div>

</section>


</main>


<script>

/* =========================
   設定
========================= */

const CLIENT_ID =
"466022765272-k322tc98rl74dc8cfmhi6hp8d31gjttn.apps.googleusercontent.com";

const FOLDER_ID =
"19KgdYkBRxvrRvX628ebS2COXmpZDdYSe";

const DRIVE_SCOPE =
"https://www.googleapis.com/auth/drive";

const KEY =
"ato_de_sagasu_v5";


/* =========================
   データ
========================= */

let items =
JSON.parse(localStorage.getItem(KEY) || "[]");

let accessToken =
localStorage.getItem("google_drive_token") || "";


/* =========================
   文字エスケープ
========================= */

function esc(s){

  return String(s || "")
    .replace(/[&<>"']/g,m=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[m]));

}


/* =========================
   ステータス表示
========================= */

function show(message,type="ok"){

  const s =
    document.getElementById("status");

  s.textContent = message;

  s.className =
    type === "error"
      ? "status-error"
      : "status-ok";

  s.style.display="block";

}


/* =========================
   ローカル保存
========================= */

function saveItems(){

  localStorage.setItem(
    KEY,
    JSON.stringify(items)
  );

}


/* =========================
   表示
========================= */

function render(a=items){

  document.getElementById("count")
    .textContent=`（${a.length}件）`;

  const c =
    document.getElementById("cards");


  if(!a.length){

    c.innerHTML=
      '<div class="empty">まだ保存されたものはありません。</div>';

    return;
  }


  c.innerHTML=a.map(x=>`

    <div class="card">

      <div class="thumb">

        ${
          x.img
          ?
          `<img src="${x.img}" alt="">`
          :
          `<div style="
              height:100%;
              display:flex;
              align-items:center;
              justify-content:center;
              font-size:45px">
              📷
           </div>`
        }

      </div>


      <div class="body">

        <b>${esc(x.title)}</b>

        <br>

        <small>
          ${esc(x.date)}
        </small>

        <div>

          ${(x.tags || []).map(t=>
            `<span class="tag">${esc(t)}</span>`
          ).join("")}

        </div>

      </div>

    </div>

  `).join("");

}


/* =========================
   Google API読み込み
========================= */

function loadGoogle(){

  return new Promise((resolve,reject)=>{

    if(window.google){

      resolve();

      return;

    }


    const script =
      document.createElement("script");

    script.src =
      "https://accounts.google.com/gsi/client";


    script.onload=()=>resolve();


    script.onerror=()=>reject(
      new Error(
        "Google認証ライブラリを読み込めませんでした。"
      )
    );


    document.head.appendChild(script);

  });

}


/* =========================
   Google Drive接続
========================= */

async function connect(){

  try{

    await loadGoogle();


    const tokenClient =
      google.accounts.oauth2.initTokenClient({

        client_id:CLIENT_ID,

        scope:DRIVE_SCOPE,

        callback:async(response)=>{

          if(response.error){

            console.error(response);

            show(
              "Google Driveへの接続に失敗しました。\n"+
              JSON.stringify(response),
              "error"
            );

            return;

          }


          accessToken =
            response.access_token;


          localStorage.setItem(
            "google_drive_token",
            accessToken
          );


          show(
            "Google Driveに接続しました。"
          );


          await checkFolder();

        }

      });


    /*
      新しいアクセストークンを取得。
      既存のトークンがおかしい場合も
      再認証できるようにする。
    */

    tokenClient.requestAccessToken({
      prompt:"consent"
    });


  }catch(error){

    console.error(error);

    show(
      "Google Driveへの接続準備に失敗しました。\n"+
      error.message,
      "error"
    );

  }

}


/* =========================
   フォルダ確認
========================= */

async function checkFolder(){

  if(!accessToken){

    return false;

  }


  try{

    const response =
      await fetch(
        "https://www.googleapis.com/drive/v3/files/"
        +encodeURIComponent(FOLDER_ID)
        +"?fields=id,name,mimeType,trashed",
        {
          headers:{
            Authorization:
              "Bearer "+accessToken
          }
        }
      );


    if(!response.ok){

      const text =
        await response.text();

      console.error(text);

      show(
        "「あとで探す」フォルダを確認できませんでした。\n"+
        text,
        "error"
      );

      return false;

    }


    const folder =
      await response.json();


    if(folder.trashed){

      show(
        "Google Driveの「あとで探す」フォルダがゴミ箱にあります。",
        "error"
      );

      return false;

    }


    if(folder.mimeType !==
       "application/vnd.google-apps.folder"){

      show(
        "指定されたIDはフォルダではありません。",
        "error"
      );

      return false;

    }


    document.getElementById("driveInfo")
      .textContent=
      "✓ 「あとで探す」フォルダを確認しました";


    return true;


  }catch(error){

    console.error(error);

    show(
      "Google Driveとの通信に失敗しました。\n"+
      error.message,
      "error"
    );

    return false;

  }

}


/* =========================
   Driveへアップロード
========================= */

async function uploadToDrive(file){

  if(!accessToken){

    throw new Error(
      "Google Driveに接続されていません。"
    );

  }


  /*
    まずフォルダが存在するか確認
  */

  const folderOK =
    await checkFolder();


  if(!folderOK){

    throw new Error(
      "「あとで探す」フォルダを確認できません。"
    );

  }


  const metadata={

    name:file.name,

    mimeType:file.type,

    parents:[FOLDER_ID]

  };


  const boundary =
    "-------atoDeSagasuBoundary";


  const metadataPart =
    JSON.stringify(metadata);


  const body =

    "--"+boundary+"\r\n"+

    "Content-Type: application/json; charset=UTF-8\r\n\r\n"+

    metadataPart+"\r\n"+

    "--"+boundary+"\r\n"+

    "Content-Type: "+file.type+"\r\n\r\n";


  const ending =
    "\r\n--"+boundary+"--";


  const blob =
    new Blob(
      [
        body,
        file,
        ending
      ],
      {
        type:
        "multipart/related; boundary="+boundary
      }
    );


  const response =
    await fetch(
      "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
      {
        method:"POST",

        headers:{
          Authorization:
            "Bearer "+accessToken
        },

        body:blob
      }
    );


  /*
    401 = トークン切れ
  */

  if(response.status === 401){

    localStorage.removeItem(
      "google_drive_token"
    );

    accessToken="";

    throw new Error(
      "Google Driveの認証期限が切れました。\n"+
      "もう一度「Google Driveと接続する」を押してください。"
    );

  }


  if(!response.ok){

    const text =
      await response.text();

    console.error(
      "Drive upload error:",
      text
    );


    throw new Error(
      "Google Driveへの保存に失敗しました。\n"+
      "HTTP "+response.status+"\n"+
      text
    );

  }


  return await response.json();

}


/* =========================
   写真追加
========================= */

async function add(files){

  if(!accessToken){

    show(
      "先に「Google Driveと接続する」を押してください。",
      "error"
    );

    return;

  }


  const list =
    Array.from(files);


  if(!list.length){

    return;

  }


  let success=0;


  for(const file of list){

    if(!file.type.startsWith("image/")){

      continue;

    }


    show(
      "Google Driveへ保存中…\n"+
      file.name
    );


    try{

      /*
        Driveへ保存
      */

      const result =
        await uploadToDrive(file);


      /*
        画面表示用の一時画像
      */

      const preview =
        await makePreview(file);


      const item={

        title:
          file.name.replace(
            /\.[^.]+$/,
            ""
          ) || "新しい写真",

        date:
          new Date().toLocaleString(
            "ja-JP"
          ),

        file:file.name,

        driveFileId:
          result.id,

        img:preview,

        tags:[]

      };


      items.unshift(item);


      /*
        表示件数を多くしすぎない
      */

      if(items.length>50){

        items=items.slice(0,50);

      }


      saveItems();

      render();

      success++;


    }catch(error){

      console.error(error);

      show(
        "保存に失敗しました。\n\n"+
        file.name+"\n\n"+
        error.message,
        "error"
      );

    }

  }


  if(success>0){

    show(
      success+"件をGoogle Driveの「あとで探す」に保存しました。"
    );

  }

}


/* =========================
   プレビュー画像
========================= */

function makePreview(file){

  return new Promise(resolve=>{

    const reader =
      new FileReader();

    reader.onload=()=>{
      resolve(reader.result);
    };

    reader.readAsDataURL(file);

  });

}


/* =========================
   ファイル選択
========================= */

document
  .getElementById("files")
  .onchange=e=>{

    add(e.target.files);

    e.target.value="";

  };


document
  .getElementById("camera")
  .onchange=e=>{

    add(e.target.files);

    e.target.value="";

  };


/* =========================
   検索
========================= */

function search(){

  const q =
    document
      .getElementById("q")
      .value
      .toLowerCase()
      .trim();


  if(!q){

    render(items);

    return;

  }


  const result =
    items.filter(x=>{

      const text =
        (
          x.title+
          " "+
          (x.tags || []).join(" ")
        ).toLowerCase();


      return text.includes(q);

    });


  render(result);

}


/* =========================
   起動
========================= */

render();


if(accessToken){

  document.getElementById("driveInfo")
    .textContent=
    "Google Drive接続情報があります";

}


/* =========================
   PWA
========================= */

if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    ()=>{
      navigator.serviceWorker
        .register("./sw.js")
        .catch(error=>{
          console.log(
            "Service Worker:",
            error
          );
        });
    }
  );

}

</script>

</body>
</html>
